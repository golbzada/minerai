<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mineraí</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup-container">
    <!-- Cabeçalho: marca + versão. Painel escuro, igual ao menu lateral do site. -->
    <header class="popup-header">
      <div class="brand-logo">
        <div class="brand-mark">M</div>
        <div class="brand-text">
          <h1 class="brand-wordmark">Minera<span class="brand-i">í</span></h1>
          <small>Inteligência de anúncios</small>
        </div>
      </div>
      <span class="version-pill" id="versao"></span>
    </header>

    <!-- Quem está conectado: uma faixa só, igual à do painel na Biblioteca.
         O nome é informação de apoio, não pode competir com a marca. -->
    <section class="auth-strip" id="user-status-card">
      <span class="auth-line" id="status-loading">
        <span class="spinner"></span>Verificando conexão...
      </span>

      <span class="auth-line online" id="status-online" style="display: none;">
        <span class="dot"></span>
        <span class="auth-text">Conectado: <strong class="user-name" id="user-display-name">Carregando...</strong></span>
      </span>

      <span class="auth-line offline" id="status-offline" style="display: none;">
        <span class="dot"></span>
        <span class="auth-text">Não conectado. Entre para minerar com 1 clique.</span>
      </span>
    </section>

    <!-- Rastreio diário: mede as ofertas salvas uma vez por dia, sozinho -->
    <section class="rastreio" id="rastreio" style="display: none;">
      <span class="rastreio-ico" data-icon="radar" data-size="14"></span>
      <div class="rastreio-info">
        <strong>Rastreio diário</strong>
        <small id="rastreio-texto">Ainda não rodou hoje.</small>
      </div>
      <button class="rastreio-rodar" id="rastreio-rodar" type="button" title="Medir agora as ofertas que faltam hoje">Rodar agora</button>
      <label class="rastreio-chave" title="Ligar ou desligar o rastreio diário">
        <input type="checkbox" id="rastreio-ligado" checked />
        <span aria-hidden="true"></span>
      </label>
    </section>

    <!-- Ações rápidas, lado a lado -->
    <div class="actions-grid">
      <button class="btn-primary" id="btn-open-dash">
        <span class="btn-ico" data-icon="painel"></span>
        <span class="btn-label">Abrir painel</span>
      </button>

      <button class="btn-secondary" id="btn-open-meta" title="Abrir a Biblioteca de Anúncios da Meta">
        <span class="btn-ico" data-icon="biblioteca"></span>
        <span class="btn-label">Biblioteca</span>
        <span class="btn-ext" data-icon="externo" data-size="12"></span>
      </button>
    </div>

    <!-- Modelar Página: baixa a estrutura de uma página para servir de
         referência. Roda no próprio navegador, sem servidor. -->
    <section class="modelar-box">
      <div class="modelar-titulo">
        <span class="modelar-ico" data-icon="modelar" data-size="14"></span>
        <div>
          <strong>Modelar página</strong>
          <small>Baixa a página de vendas pronta para a sua IA modelar.</small>
        </div>
      </div>

      <div class="modelar-linha">
        <label class="modelar-campo">
          <span class="campo-ico" data-icon="link" data-size="14"></span>
          <input
            type="url"
            id="modelar-url"
            class="modelar-input"
            placeholder="https://pagina-de-vendas.com.br"
            autocomplete="off"
            spellcheck="false"
          />
        </label>
      </div>

      <button class="btn-primary modelar-btn" id="btn-modelar">
        <span class="btn-ico" data-icon="baixar"></span>
        <span class="btn-label">Baixar página</span>
      </button>

      <button class="btn-secondary modelar-btn" id="btn-autorizar" style="display: none;">
        <span class="btn-ico" data-icon="chave"></span>
        <span class="btn-label">Liberar modelagem no painel</span>
      </button>

      <p class="modelar-aviso" id="modelar-aviso"></p>
    </section>
  </div>

  <script src="rastreio-regras.js"></script>
  <script src="popup.js"></script>
</body>
</html>
